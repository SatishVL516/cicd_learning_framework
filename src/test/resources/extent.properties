# 1 Enable Reporters
extent.reporter.spark.start=true
extent.reporter.html.start=true
extent.reporter.pdf.start=true

# 2 Set Configurations for Reporters
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.html.config=src/test/resources/extent-config.xml

# 3 Define Report Output Locations
extent.reporter.spark.out=SparkReport/SparkReport.html
extent.reporter.html.out=ExtentReport/ExtentReport.html
extent.reporter.pdf.out=PdfReport/ExtentPdf.pdf

# 4 Set Folder Structure for Reports
basefolder.name=reports/report_
basefolder.datetimepattern=dd-MMM-yyyy_HH-mm-ss

# 5 Configure Spark Report View Order
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# 6 Screenshot Configuration
screenshot.dir=Failed_Screenshots
screenshot.rel.path=../Failed_Screenshots/

# 7 System Information Metadata
systeminfo.os=Windows11
systeminfo.user=Satish
systeminfo.build=1.1
systeminfo.AppName=Kavach